[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "n2ln-qem"
version = "0.1.0"
description = "Noise-to-Less-Noise Quantum Error Mitigation via Self-Supervised Learning"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
authors = [
    {name = "N2LN-QEM Team", email = "your-email@example.com"}
]
keywords = ["quantum computing", "error mitigation", "machine learning", "self-supervised"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3.10",
    "Topic :: Scientific/Engineering :: Physics",
]

[project.urls]
Homepage = "https://github.com/mdanimulhoq/QuantumSelfSupervisedDenoising-1"
Repository = "https://github.com/mdanimulhoq/QuantumSelfSupervisedDenoising-1.git"

[project.dependencies]
torch = "==2.0.1"
qiskit = "==0.46.0"
numpy = "==1.24.3"
scipy = "==1.10.1"
hydra-core = "==1.3.2"
wandb = "==0.15.12"

[tool.pytest.ini_options]
minversion = "7.0"
addopts = "-ra -q --tb=short"
testpaths = ["tests"]
python_files = "test_*.py"
python_classes = "Test*"
python_functions = "test_*"

[tool.black]
line-length = 88
target-version = ['py310']
include = '\.pyi?$'
extend-exclude = '''
/(
    \.eggs
  | \.git
  | \.hg
  | \.mypy_cache
  | \.tox
  | \.venv
  | _build
  | buck-out
  | build
  | dist
)/
'''

[tool.isort]
profile = "black"
line_length = 88
multi_line_output = 3
include_trailing_comma = true
force_grid_wrap = 0
use_parentheses = true
ensure_newline_before_comments = true

[tool.mypy]
python_version = "3.10"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = false
ignore_missing_imports = true
